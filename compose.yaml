services:
  db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD:?Set MSSQL_SA_PASSWORD in the environment}
    ports:
      - "1433:1433"
    volumes:
      - sqlserver-data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -C -Q 'SELECT 1' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
  api:
    build:
      context: .
      dockerfile: PL/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__DefaultConnection: "Server=db;Database=HMS;User Id=sa;Password=${MSSQL_SA_PASSWORD:?Set MSSQL_SA_PASSWORD in the environment};TrustServerCertificate=True"
      JWT__SigningKey: ${JWT_SIGNING_KEY:?Set JWT_SIGNING_KEY to at least 32 bytes}
      JWT__Issuer: ${JWT_ISSUER:-https://localhost}
      JWT__Audience: ${JWT_AUDIENCE:-https://localhost}
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy
volumes:
  sqlserver-data:
